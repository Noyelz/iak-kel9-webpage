{% load static %}
<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{% block title %}Asuransi Analytics{% endblock %}</title>
        <link rel="stylesheet"
        href="{% static 'dashboard/css/style.css' %}">
    </head>
    <body>
        <div class="topbar">Memahami data. Merencanakan perlindungan.</div>

        <header class="header">
            <nav class="container navigation" aria-label="Navigasi utama">
                <a class="brand" href="{% url 'home' %}">
                    <span class="brand-mark" aria-hidden="true">E</span>
                    <span>Asuransi<span class="brand-light"> Analytics</span></span>
                </a>

                <div class="nav-links">
                    <a href="{% url 'home' %}">Beranda</a>

                {% if user.is_authenticated %}
                    <a href="{% url 'dashboard' %}">Dashboard</a>
                    <a href="{% url 'warehouse' %}">Semua data</a>
                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button class="button button-outline" type="submit">
                            Keluar
                        </button>
                    </form>
                {% else %}
                    <a class="button" href="{% url 'login' %}">Masuk</a>
                {% endif %}
                </div>    
            </nav>
        </header>

        <main>
            {% block content %}{% endblock %}
        </main>

        <footer class="footer">
            <div class="container">
                Kelompok 9 IAK - Asuransi
            </div>
        </footer>
    </body>
</html>
